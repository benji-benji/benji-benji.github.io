<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="508" viewBox="0 0 460 254" role="img" aria-label="The harness loop: model, benchmark, method, case">
  <style>
    /* Palette and weights follow docs/alphaedit-chart-style-guide.md.
       Colours are literal here so the file renders standalone. */
    .t   { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 9px;  fill: #161C22; }
    .tb  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 9px;  font-weight: 600; fill: #161C22; }
    .tk  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 8px;  fill: #161C22; }
    .tm  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 8px;  fill: #97A5B3; }
    .tl  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 7.5px; letter-spacing: .08em; fill: #97A5B3; }
    .box  { fill: #FFFFFF; stroke: #3B4652; stroke-width: 1; }
    .boxd { fill: none; stroke: #97A5B3; stroke-width: 1; stroke-dasharray: 3 2.5; }
  </style>
  <rect width="460" height="254" fill="#FFFFFF"/>

  <!-- level 1: models -->
  <rect class="boxd" x="10" y="10" width="440" height="234" rx="5"/>
  <text class="tl" x="19" y="25">FOR EACH MODEL</text>
  <rect class="box" x="20" y="31" width="130" height="18" rx="3"/>
  <text class="tk" x="27" y="44">gpt2-xl</text>
  <rect class="box" x="156" y="31" width="130" height="18" rx="3"/>
  <text class="tk" x="163" y="44">llama3-8b</text>

  <!-- level 2: benchmarks -->
  <rect class="boxd" x="20" y="58" width="420" height="178" rx="5"/>
  <text class="tl" x="29" y="73">FOR EACH BENCHMARK</text>
  <rect class="box" x="30" y="79" width="74" height="17" rx="3"/>
  <text class="tm" x="36" y="91">counterfact</text>
  <rect class="box" x="108" y="79" width="50" height="17" rx="3"/>
  <text class="tm" x="117" y="91">zsre</text>
  <rect class="box" x="162" y="79" width="56" height="17" rx="3"/>
  <text class="tm" x="169" y="91">ripple</text>
  <rect class="box" x="222" y="79" width="60" height="17" rx="3"/>
  <text class="tm" x="229" y="91">mquake</text>
  <rect class="box" x="286" y="79" width="54" height="17" rx="3"/>
  <text class="tm" x="293" y="91">genie</text>

  <!-- level 3: methods -->
  <rect class="boxd" x="30" y="104" width="400" height="124" rx="5"/>
  <text class="tl" x="39" y="119">FOR EACH METHOD</text>
  <rect class="box" x="40" y="125" width="56" height="17" rx="3"/>
  <text class="tm" x="49" y="137">rome</text>
  <rect class="box" x="100" y="125" width="58" height="17" rx="3"/>
  <text class="tm" x="108" y="137">memit</text>
  <rect class="box" x="162" y="125" width="70" height="17" rx="3"/>
  <text class="tm" x="169" y="137">alphaedit</text>
  <rect class="box" x="236" y="125" width="62" height="17" rx="3"/>
  <text class="tm" x="244" y="137">anyedit</text>
  <rect class="box" x="302" y="125" width="56" height="17" rx="3"/>
  <text class="tm" x="310" y="137">grace</text>
  <rect class="box" x="362" y="125" width="58" height="17" rx="3"/>
  <text class="tm" x="370" y="137">remedi</text>

  <!-- level 4: cases -->
  <rect x="40" y="150" width="380" height="68" rx="4" fill="#AFEAFC" stroke="#3B4652"/>
  <text class="tl" x="49" y="165">FOR EACH OF 95 SAMPLED CASES</text>

  <circle cx="58" cy="180" r="7.5" fill="#FFFFFF" stroke="#3B4652"/>
  <text class="tb" x="55" y="183">1</text>
  <text class="tk" x="71" y="183">snapshot weights</text>

  <circle cx="58" cy="202" r="7.5" fill="#FFFFFF" stroke="#3B4652"/>
  <text class="tb" x="55" y="205">2</text>
  <text class="tk" x="71" y="205">score pre-edit</text>

  <circle cx="214" cy="180" r="7.5" fill="#FFFFFF" stroke="#3B4652"/>
  <text class="tb" x="211" y="183">3</text>
  <text class="tk" x="227" y="183">apply the edit</text>

  <circle cx="214" cy="202" r="7.5" fill="#FFFFFF" stroke="#3B4652"/>
  <text class="tb" x="211" y="205">4</text>
  <text class="tk" x="227" y="205">score post-edit</text>

  <circle cx="336" cy="180" r="7.5" fill="#FFFFFF" stroke="#3B4652"/>
  <text class="tb" x="333" y="183">5</text>
  <text class="tk" x="349" y="183">restore</text>
</svg>
